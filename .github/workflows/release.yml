name: Release to npm

# Stages any package whose version in package.json is not on npm yet (npm staged publishing).
# Setup (once): add an npm granular token ("Read and write (stage only)" is enough) as the
# repository secret NPM_TOKEN.
# Release: bump "version" in packages/<name>/package.json, commit, run this workflow from the
# Actions tab (or push a tag like v0.1.0), then approve each staged version with 2FA on
# npmjs.com under Staged Packages.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm --version
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run check:skills
      - run: node scripts/publish.js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
