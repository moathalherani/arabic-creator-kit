name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run check:skills
      - name: Check community hooks in contrib/hooks
        run: node scripts/merge-hooks.js --check
      - name: Check the prompt library in prompts/
        run: node scripts/check-prompts.js
      - name: Auto-captions tests (Python)
        run: python3 -m unittest discover autocaptions
      - run: node scripts/build-site.js
      - name: Pack check
        run: |
          for d in packages/*; do (cd "$d" && npm pack --dry-run); done
