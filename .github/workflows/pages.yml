name: Playground

# Builds the playground and the Claude Skill ZIPs and publishes them to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # to commit community hooks merged from contrib/hooks
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Move merged community hooks from contrib/hooks into the dataset
        run: |
          node scripts/merge-hooks.js
          if [ -n "$(git status --porcelain packages/arabic-hooks contrib/hooks)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/arabic-hooks/src/hooks-data.js contrib/hooks
            git commit -m "Add community hooks from contrib/hooks"
            git push
          fi
      - run: npm test
      - run: node scripts/build-site.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Tell Bing and other IndexNow search engines about the pages
        if: success()
        continue-on-error: true
        run: |
          urls=$(grep -o '<loc>[^<]*</loc>' _site/sitemap.xml | sed 's#</\?loc>##g' | jq -R . | jq -s .)
          jq -n --argjson urls "$urls" '{host:"moathalherani.github.io", key:"851d477d75252872d5cd3f0f0af68add", keyLocation:"https://moathalherani.github.io/arabic-creator-kit/851d477d75252872d5cd3f0f0af68add.txt", urlList:$urls}' > indexnow.json
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json; charset=utf-8" --data @indexnow.json
